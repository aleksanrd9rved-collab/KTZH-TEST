<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Тест по КТЖ</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
     
    <div id="mode-selection" class="container slide-in">
        <h1>Выберите режим работы</h1>
        <div class="mode-buttons">
            <button id="timed-mode-btn" class="mode-btn">Тестирование на время</button>
            <button id="simple-mode-btn" class="mode-btn">Простое тестирование</button>
            <button id="simple-mode-dtn" class="mode-btn">Другое тестирование</button>
        </div>
    </div>

    <div class="container" style="display: none;">
        <div class="quiz-header">
            <button id="back-to-mode-btn" class="header-btn">‹</button>
            <h1>Тест по КТЖ (ПЭТ, СИЗ, ИС)</h1>
        </div>
        <div id="quiz">
            <div id="timer">30:00</div>
            <div id="progress">Вопрос 1 из 100</div>
            <div id="question"></div>
            <div id="options"></div>
        </div>
        <div id="result" class="hidden">
            <h2 id="result-title">Ваш результат</h2>
            <div class="chart-container" style="position: relative; height:250px; width:250px; margin: auto;">
                <canvas id="progressChart"></canvas>
            </div>
            <p id="result-text"></p>
            <button id="back-to-menu-btn" class="mode-btn">Вернуться в меню</button>
        </div>
    </div>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script src="script.js"></script>
</body>
</html>
