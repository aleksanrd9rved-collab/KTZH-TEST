<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <title>ВЛС Тренажер</title>
  

  <style>
    body {
  background: #0f172a;
  color: white;
  font-family: Arial;
  text-align: center;
}

.container {
  width: 90%;
  max-width: 600px;
  margin: auto;
  margin-top: 40px;
}

button {
  padding: 10px 20px;
  margin-top: 15px;
  background: #2563eb;
  border: none;
  color: white;
  cursor: pointer;
  border-radius: 8px;
}

button:hover {
  background: #1d4ed8;
}

.hidden {
  display: none;
}

.answer {
  display: block;
  margin: 10px;
  padding: 10px;
  background: #1e293b;
  border-radius: 8px;
  cursor: pointer;
}

.answer:hover {
  background: #334155;
}
  </head>
  </style>
<body>

<div class="container">
  <h1>📡 ВЛС Тренажёр</h1>

  <div id="start">
    <button onclick="startTest()">Начать тест</button>
  </div>

  <div id="test" class="hidden">
    <div id="timer">⏱ 0</div>
    <div id="question"></div>
    <div id="answers"></div>

    <button onclick="nextQuestion()">Далее</button>
  </div>

  <div id="result" class="hidden">
    <h2>Результат</h2>
    <p id="score"></p>
    <button onclick="restart()">Заново</button>
  </div>
</div>

<script>let questions = [
  {
    q: "Рабочий частотный диапазон ВЛС?",
    a: ["10^0–10^9 Гц", "10^0–10^5 Гц", "10^0–10^6 Гц", "10^11–10^15 Гц"],
    correct: 0
  },
  {
    q: "Как меняется волновое сопротивление?",
    a: [
      "уменьшается",
      "не зависит",
      "увеличивается затем стабилизируется",
      "зависит от кабеля"
    ],
    correct: 2
  },
  {
    q: "Типы направляющих систем?",
    a: [
      "все верны",
      "воздушные кабельные",
      "спутниковые",
      "радиорелейные кабельные оптические"
    ],
    correct: 3
  },
  {
    q: "Уход за оптическими разъемами?",
    a: [
      "руками",
      "спиртом",
      "сжатый воздух + изопропил",
      "не нужен"
    ],
    correct: 2
  },
  {
    q: "Виды скрутки?",
    a: ["пучковая повивная", "оптические", "металлические", "магистральные"],
    correct: 0
  },
  {
    q: "Переходное затухание?",
    a: [
      "увеличивается",
      "уменьшается",
      "уменьшается потом стаб",
      "не меняется"
    ],
    correct: 0
  },
  {
    q: "Защита от молнии?",
    a: [
      "увеличение коэффициента",
      "заземление",
      "изоляция",
      "район"
    ],
    correct: 1
  },
  {
    q: "Классификация кабелей?",
    a: [
      "подземные",
      "симметричные коаксиальные",
      "симметричные коаксиальные обмоточные",
      "подводные"
    ],
    correct: 2
  },
  {
    q: "Взаимные влияния?",
    a: [
      "активные",
      "регулярные",
      "непосредственные косвенные",
      "косвенные"
    ],
    correct: 2
  },
  {
    q: "Рабочее затухание?",
    a: [
      "согласованные",
      "разомкнутые",
      "любые",
      "КЗ"
    ],
    correct: 0
  }
];

let current = 0;
let score = 0;
let timer = 0;
let interval;

function startTest() {
  document.getElementById("start").classList.add("hidden");
  document.getElementById("test").classList.remove("hidden");

  interval = setInterval(() => {
    timer++;
    document.getElementById("timer").innerText = "⏱ " + timer;
  }, 1000);

  showQuestion();
}

function showQuestion() {
  let q = questions[current];
  document.getElementById("question").innerText = q.q;

  let answersHTML = "";
  q.a.forEach((ans, i) => {
    answersHTML += `<div class="answer" onclick="select(${i})">${ans}</div>`;
  });

  document.getElementById("answers").innerHTML = answersHTML;
}

let selected = null;

function select(i) {
  selected = i;
}

function nextQuestion() {
  if (selected === null) return;

  if (selected === questions[current].correct) {
    score++;
  }

  selected = null;
  current++;

  if (current >= questions.length) {
    finish();
  } else {
    showQuestion();
  }
}

function finish() {
  clearInterval(interval);

  document.getElementById("test").classList.add("hidden");
  document.getElementById("result").classList.remove("hidden");

  document.getElementById("score").innerText =
    "Правильно: " + score + " из " + questions.length +
    " | Время: " + timer + " сек";
}

function restart() {
  location.reload();
}</script>
</body>
</html>
